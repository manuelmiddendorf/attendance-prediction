[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yoga-attendance"
version = "0.1.0"
description = "Machine learning project for predicting yoga class attendance from booking history."
requires-python = ">=3.12"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
  "notebooks/scratch",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

